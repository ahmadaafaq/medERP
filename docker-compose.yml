services:
  # ── PostgreSQL 16 ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: unicampus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-unicampus}
      POSTGRES_PASSWORD: ${DB_PASS:-unicampus_secret}
      POSTGRES_DB: ${DB_NAME:-unicampus_erp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-unicampus} -d ${DB_NAME:-unicampus_erp}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - unicampus_net

  # ── Redis 7 ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: unicampus_redis
    restart: unless-stopped
    # Only pass --requirepass when REDIS_PASSWORD is non-empty (empty value crashes Redis 7)
    command: >
      sh -c "
        if [ -n \"$$REDIS_PASSWORD\" ]; then
          redis-server --requirepass $$REDIS_PASSWORD;
        else
          redis-server;
        fi
      "
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD:-}" ping 2>/dev/null | grep -q PONG || redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - unicampus_net

  # ── NestJS Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: unicampus_backend
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 8081
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '8081:8081'
    networks:
      - unicampus_net
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8081/api/v1/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Next.js Frontend ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: unicampus_frontend
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: http://localhost:8081/api/v1
      BACKEND_INTERNAL_URL: http://backend:8081/api/v1/:path*
    depends_on:
      - backend
    ports:
      - '3000:3000'
    networks:
      - unicampus_net

  # ── Nginx Reverse Proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: unicampus_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - frontend
      - backend
    networks:
      - unicampus_net

volumes:
  postgres_data:
  redis_data:

networks:
  unicampus_net:
    driver: bridge
