services:
  # ── NestJS Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 8081
    ports:
      - '8081:8081'
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -qO- http://127.0.0.1:8081/api/v1/health/ping || exit 1' ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ── Next.js Frontend ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://34.236.107.120:8081/api/v1
    depends_on:
      - backend
    ports:
      - '3000:3000'
    # networks:
    #   - unicampus_net

    #   # ── Nginx Reverse Proxy ────────────────────────────────────────────────────
