services:
  # ── NestJS Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 8081
    ports:
      - '8081:8081'
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - unicampus_net
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8081/api/v1/health/ping || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ── Next.js Frontend ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://backend:8081/api/v1
    depends_on:
      - backend
    ports:
      - '3000:3000'
    networks:
      - unicampus_net

  # ── Nginx Reverse Proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '80:80'
    depends_on:
      - frontend
      - backend
    networks:
      - unicampus_net

  # ── PostgreSQL 16 (Optional Local DB) ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-unicampus}
      POSTGRES_PASSWORD: ${DB_PASS:-unicampus_secret}
      POSTGRES_DB: ${DB_NAME:-unicampus_erp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - '${LOCAL_DB_PORT:-5434}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-unicampus} -d ${DB_NAME:-unicampus_erp}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - unicampus_net

  # ── Redis 7 (Optional Local Cache) ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      sh -c "
        if [ -n \"$$REDIS_PASSWORD\" ]; then
          redis-server --requirepass $$REDIS_PASSWORD;
        else
          redis-server;
        fi
      "
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    ports:
      - '${LOCAL_REDIS_PORT:-6380}:6379'
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD:-}" ping 2>/dev/null | grep -q PONG || redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - unicampus_net

volumes:
  postgres_data:
  redis_data:
  backend_uploads:

networks:
  unicampus_net:
    driver: bridge
