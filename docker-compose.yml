services:
  # ── NestJS Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: unicampus_backend
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 8081
      # ── Remote PostgreSQL (34.236.107.120) ─────────────────────────────────
      DB_HOST: ${DB_HOST:-34.236.107.120}
      DB_PORT: ${DB_PORT:-5433}
      DB_USER: ${DB_USER:-unicampus}
      DB_PASS: ${DB_PASS:-unicampus_dev@qsd!3ous}
      DB_NAME: ${DB_NAME:-unicampus_erp}
      # ── Remote Redis (34.236.107.120) ───────────────────────────────────────
      REDIS_HOST: ${REDIS_HOST:-34.236.107.120}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - '8081:8081'
    networks:
      - unicampus_net
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8081/api/v1/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Next.js Frontend ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: unicampus_frontend
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: http://localhost:8081/api/v1
      BACKEND_INTERNAL_URL: http://backend:8081/api/v1/:path*
    depends_on:
      - backend
    ports:
      - '3000:3000'
    networks:
      - unicampus_net

  # ── Nginx Reverse Proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: unicampus_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - frontend
      - backend
    networks:
      - unicampus_net

networks:
  unicampus_net:
    driver: bridge

